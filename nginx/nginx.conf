# Defines the number of simultaneous connections per worker process.
events {
    worker_connections 1024;
}

http {
    # --- Rate Limiting ---
    # Tracks users by IP to prevent system abuse.
    # Limits each user to 10 requests per second.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # --- Payload Configuration ---
    # While spam text is small, keeping this at 10MB maintains 
    # infrastructure uniformity across your AI projects.
    client_max_body_size 10M;

    # --- Smart Load Balancing ---
    # Groups the 3 API replicas into a cluster.
    upstream spam_api_cluster {
        # Using least_conn ensures that requests are routed to the 
        # API replica currently doing the least amount of work.
        least_conn;
        
        # Points to the 'api' service defined in the spam docker-compose.
        server api:8000;
    }

    server {
        # Gateway entry point on standard HTTP port.
        listen 80;

        # --- Dynamic Service Discovery ---
        # Connects to Docker's internal DNS (127.0.0.11).
        # This allows Nginx to find the container IPs in the background.
        resolver 127.0.0.11 valid=5s;

        location / {
            # Applies the 10r/s rate limit with a burst buffer of 20.
            limit_req zone=api_limit burst=20 nodelay;

            # --- Stability Routing ---
            # We point directly to the upstream cluster name.
            # This is significantly faster than using the variable method 
            # because it avoids the per-request DNS lookup latency.
            proxy_pass http://spam_api_cluster;

            # --- Proxy Headers ---
            # Forwards essential metadata so FastAPI knows the real client details.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- Performance Timeouts ---
            # Ensures the connection stays open for the duration 
            # of the DistilBERT inference (120s safety margin).
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # --- Custom Error Handling ---
        # Returns a clean message when the rate limit is exceeded.
        error_page 429 = /limit_reached;
        location = /limit_reached {
            return 429 "Too many requests. Please wait a moment.";
        }
    }
}
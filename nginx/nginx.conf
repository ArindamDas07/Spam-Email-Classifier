# Defines the number of simultaneous connections that can be opened by a worker process.
events {
    worker_connections 1024;
}

http {
    # --- Rate Limiting Configuration ---
    # Creates a 10MB memory zone to track request rates by the client's IP address.
    # The rate is restricted to 10 requests per second to protect the BERT workers.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # --- Backend Load Balancing ---
    # Groups the API replicas into a logical cluster named 'api_backend'.
    upstream api_backend {
        # Sends incoming requests to the API replica with the fewest active connections.
        # This is efficient for ML tasks where inference time varies per request.
        least_conn;
        
        # Points to the 'api' service name defined in docker-compose on port 8000.
        server api:8000;
    }

    server {
        # The gateway listens on the standard HTTP port (80).
        listen 80;

        # --- Dynamic Service Discovery ---
        # Uses Docker's internal DNS (127.0.0.11) to resolve container names.
        # Setting 'valid=5s' forces Nginx to refresh the IP addresses of the API replicas 
        # frequently, preventing connection errors when containers scale or restart.
        resolver 127.0.0.11 valid=5s;

        location / {
            # Applies the rate limit policy defined above.
            # 'burst=20' allows short spikes of traffic.
            # 'nodelay' ensures that allowed requests are processed without artificial delay.
            limit_req zone=api_limit burst=20 nodelay;

            # --- Proxy Routing ---
            # Storing the backend address in a variable forces Nginx to use the 
            # DNS resolver for every request, avoiding stale IP (502) issues.
            set $target http://api_backend;
            proxy_pass $target;

            # --- Standard Proxy Headers ---
            # Forwards the original host name and the real client IP to the FastAPI backend.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- Performance Timeouts ---
            # BERT model inference is a heavy task. These settings ensure the connection 
            # remains open for up to 120 seconds while the worker completes the math.
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # --- Error Handling ---
        # Returns a custom 429 message instead of the default Nginx error page 
        # when the rate limit threshold is crossed.
        error_page 429 = /rate_limit_response;
        location = /rate_limit_response {
            return 429 "Too many requests. Please slow down and try again later.";
        }
    }
}